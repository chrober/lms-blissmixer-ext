name: Validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tests/validate_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py"
